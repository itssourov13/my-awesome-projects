name: Sync public projects and deploy showcase

on:
  push:
    branches:
      - main
    paths:
      - "projects.json"
      - "popular/**"
      - "index.html"
      - "styles.css"
      - "app.js"
      - "README.md"
      - "REPORT.md"
      - "docs/**"
      - "scripts/**"
      - "assets/**"
      - "docs/PRIVATE_PROJECTS.md"
      - "docs/ASSET_GUIDELINES.md"
      - ".github/workflows/pages.yml"
      - ".github/workflows/validate.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: showcase-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Align with the latest main branch head
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Refresh only public repository metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_public_projects.py

      - name: Set up Python for image generation
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install image-generation tooling
        run: python -m pip install --disable-pip-version-check --quiet Pillow==12.3.0

      - name: Collect artwork for new project entries
        run: python3 scripts/collect_web_artwork.py --missing || echo "Some artwork sources were unavailable; vector fallback will be used for those entries."

      - name: Generate covers and feature panels
        run: |
          python3 scripts/generate_covers.py
          python3 scripts/generate_project_panels.py

      - name: Generate README-first showcase and catalog docs
        run: |
          python3 scripts/generate_readme.py
          python3 scripts/generate_catalog.py

      - name: Validate public catalog, source visibility, and generated README
        run: |
          python3 -m json.tool projects.json > /dev/null
          python3 scripts/validate.py
          python3 scripts/generate_readme.py --check
          node --check app.js
          python3 -m unittest discover -s tests -v

      - name: Commit generated showcase changes only when needed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md projects.json docs/PROJECT_CATALOG.md assets/brand assets/projects assets/artwork-sources.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No catalog or generated showcase changes."
          else
            git commit -m "chore(showcase): sync public projects and regenerate README"
            git push origin "HEAD:main"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy showcase to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

          <text x="600" y="696" fill="#c4a9ff" font-family="monospace" font-size="16">// project context</text><text x="600" y="733" fill="#a5acc0" font-family="monospace" font-size="16">const plan = await agent.plan();</text><text x="600" y="770" fill="#a5acc0" font-family="monospace" font-size="16">await verify(plan);</text><text x="600" y="807" fill="#c4a9ff" font-family="monospace" font-size="16">// review changes</text><text x="600" y="844" fill="#a5acc0" font-family="monospace" font-size="16">if (approved) deploy();</text><text x="600" y="881" fill="#c4a9ff" font-family="monospace" font-size="16">return { status: &#x27;ready&#x27; };</text>

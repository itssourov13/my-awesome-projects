 y="915" width="1040" height="180" rx="18" fill="#171822" stroke="#e7adff" stroke-opacity=".6"/><text x="120" y="969" fill="#e7adff" font-family="monospace" font-size="14" letter-spacing="2">CURRENT STATUS</text><text x="120" y="1027" fill="#f4f2eb" font-family="system-ui,sans-serif" font-size="27" font-weight="650">Creative experiment</text><text x="80" y="1210" fill="#d4d8dc" font-family="system-ui,sans-serif" font-size="18">Source visibility and live preview access are listed separately.</text><text x="80" y="1265" fill="#e7adff" font-family="monospace" font-size="14" letter-spacing="3">BUILD / TEST / REFINE</text><text x="80" y="1310" fill="#d4d8dc" font-family="system-ui,sans-serif" font-size="20" font-weight="450">This graphic is a curated portfolio visual; it does not</text><text x="80" y="1342" fill="#d4d8dc" font-family="system-ui,sans-serif" font-size="20" font-weight="450">claim all listed features are production-ready.</text><path d="M80 1450 H1120" stroke="#ffffff" stroke-opacity=".24"/>
